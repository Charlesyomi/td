databases:
  - name: todo-db
    databaseName: todo
    user: todo
    plan: free

services:
  - type: web
    name: todo-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://your-frontend-url.vercel.app